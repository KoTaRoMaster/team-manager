version: "3.8"

services:
  web:
    build: .
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      - db           # FastAPI не запустится, пока не поднимется база данных

  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_password
      POSTGRES_DB: db_team_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Данные БД не пропадут при перезапуске

volumes:
  postgres_data: